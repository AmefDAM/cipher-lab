[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-lab"
version = "0.1.0"
description = "Interactive playground for classical ciphers"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]